ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto code formatting
  autofix_prs: false
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: quarterly
  submodules: false

# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^examples/cable_calibration/reports/cable_calibration_(en|zh)\.html$
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.16.10
    hooks:
      # Run the linter.
      - id: ruff
        exclude: ^examples/cable_calibration/backends/
        args: [--fix] # Apply fixes to resolve lint violations.
      # Run the formatter.
      - id: ruff-format
        exclude: ^examples/cable_calibration/backends/
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: []
        exclude: \.(js|css)$
  - repo: local
    hooks:
      - id: check-warp-array-syntax
        name: check warp array syntax
        entry: python scripts/check_warp_array_syntax.py
        language: system
        types: [python]
        exclude: ^(scripts/check_warp_array_syntax\.py$|examples/cable_calibration/backends/)
      - id: no-patch-dict-sys-modules
        name: patch individual sys.modules entries instead of patch.dict(sys.modules)
        # patch.dict also drops modules first imported inside it (e.g. Warp internals).
        language: pygrep
        entry: patch\.dict\s*\((?:\s*|[^()]*\bin_dict\s*=\s*)["']?sys\.modules\b
        args: [--multiline]
        files: ^task_tuning/tests/.*\.py$
