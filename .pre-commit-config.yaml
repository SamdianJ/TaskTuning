repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
        exclude: ^examples/cable_calibration/reports/cable_calibration_(en|zh)\.html$
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^examples/cable_calibration/backends/
      - id: ruff-format
        exclude: ^examples/cable_calibration/backends/
