[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "task-tuning"
version = "0.2.0"
description = "Composable, evidence-based calibration for the Newton ecosystem"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "LICENSE-DOCS", "NOTICE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
cma = ["cma>=4,<5"]
cable = ["scipy>=1.11"]
gl = ["pyglet>=2.1,<3"]
dev = ["ruff==0.16.10", "pre-commit>=4,<5", "build>=1,<2"]

[project.urls]
Repository = "https://github.com/SamdianJ/TaskTuning"
AtomGit = "https://atomgit.com/SamiulJ/tasktuning"
Upstream = "https://github.com/newton-physics/newton-calibration"

[project.scripts]
task-tuning = "task_tuning.__main__:main"

[tool.setuptools.packages.find]
include = ["task_tuning*"]
exclude = ["task_tuning.tests*"]

[tool.setuptools.exclude-package-data]
task_tuning = ["tests/**"]

[tool.ruff]
extend = "ruff-newton.toml"
